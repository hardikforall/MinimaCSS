<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MinimaCSS — Documentation</title>
    <meta
      name="description"
      content="MinimaCSS — a minimal, modern CSS framework. Documentation."
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link rel="stylesheet" href="../dist/minimacss.css" />
    <link rel="stylesheet" href="customisation/prism/prism.css" />
    <link rel="stylesheet" href="customisation/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='8' fill='%23214ddf'/><text x='20' y='28' text-anchor='middle' font-family='ui-sans-serif,system-ui,sans-serif' font-size='24' font-weight='800' fill='white'>M</text></svg>"
    />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-Q2MLQT1HY1"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-Q2MLQT1HY1");
    </script>
  </head>

  <body>
    <!-- Top chrome: theme toggle only. Same icon-pill design as
         examples/index.html so the two pages feel like one site. -->
    <div class="docs-topbar">
      <div class="docs-theme-toggle" role="radiogroup" aria-label="Theme">
        <input type="radio" id="theme-light" name="theme_mode" value="light" />
        <label for="theme-light" title="Light">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M2.5 2.5l1 1M12.5 12.5l1 1M1 8h1.5M13.5 8H15M2.5 13.5l1-1M12.5 3.5l1-1"/></svg>
        </label>
        <input type="radio" id="theme-dark" name="theme_mode" value="dark" />
        <label for="theme-dark" title="Dark">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9.3A6 6 0 1 1 6.7 2a4.7 4.7 0 0 0 7.3 7.3z"/></svg>
        </label>
        <input
          type="radio"
          id="theme-system"
          name="theme_mode"
          value="system"
          checked
        />
        <label for="theme-system" title="System">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="2.5" width="12.5" height="9" rx="1.25"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        </label>
      </div>
    </div>

    <div id="app"></div>

    <script>
      const brandLogo =
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='8' fill='%23214ddf'/><text x='20' y='28' text-anchor='middle' font-family='ui-sans-serif,system-ui,sans-serif' font-size='24' font-weight='800' fill='white'>M</text></svg>";

      window.$docsify = {
        coverpage: true,
        name: "MinimaCSS",
        nameLink: "./",
        logo: brandLogo,
        repo: "https://github.com/hardikforall/MinimaCSS",
        requestHeaders: {
          "cache-control": "max-age=0",
        },
        auto2top: true,
        loadSidebar: true,
        maxLevel: 0,
        subMaxLevel: 1,
        topMargin: 90,
        copyCode: {
          buttonText: "Copy",
          errorText: "Error",
          successText: "Copied",
        },
        search: {
          placeholder: "Search the docs",
          noData: "No matches found.",
          depth: 2,
        },
        toc: {
          tocMaxLevel: 3,
          target: "h2, h3, h4, h5, h6",
          ignoreHeaders: [
            "<!-- {docsify-ignore} -->",
            "<!-- {docsify-ignore-all} -->",
          ],
        },
        "flexible-alerts": {
          style: "flat",
        },
      };

      // --- Theme switcher: applies on the <html> element so `color-scheme`
      // cascades to native form controls and scrollbars.
      const root = document.documentElement;
      const radios = {
        light: document.getElementById("theme-light"),
        dark: document.getElementById("theme-dark"),
        system: document.getElementById("theme-system"),
      };

      function applyTheme(mode) {
        if (mode === "system") root.removeAttribute("data-theme");
        else root.setAttribute("data-theme", mode);
        localStorage.setItem("minimacss-theme", mode);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const saved = localStorage.getItem("minimacss-theme") || "system";
        (radios[saved] || radios.system).checked = true;
        applyTheme(saved);

        for (const [mode, input] of Object.entries(radios)) {
          input.addEventListener("change", () => applyTheme(mode));
        }
      });

      if (typeof navigator.serviceWorker !== "undefined") {
        navigator.serviceWorker.register("sw.js");
      }
    </script>

    <!-- Docsify v4 -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
    <script src="https://unpkg.com/docsify-copy-code@2"></script>
    <script src="https://unpkg.com/docsify-plugin-toc@1.3.1/dist/docsify-plugin-toc.min.js"></script>
    <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>

    <!-- Component demos in markdown often use these helpers. -->
    <script>
      function changeTab(event, tabId) {
        event.preventDefault();
        const tabs = document.querySelectorAll(".tabs .tab");
        const tabContents = document.querySelectorAll(".tab-content");
        tabs.forEach((tab) => {
          tab.classList.remove("active");
          tab.removeAttribute("aria-current");
        });
        tabContents.forEach((c) => (c.style.display = "none"));
        event.currentTarget.classList.add("active");
        event.currentTarget.setAttribute("aria-current", "page");
        const content = document.getElementById(tabId);
        if (content) content.style.display = "block";
      }

      var currentSlideoverelement;
      function toggleSlideover(selector) {
        if (selector) currentSlideoverelement = selector;
        else selector = currentSlideoverelement;
        var slideover = document.querySelector(selector);
        if (!slideover) return;
        slideover.classList.toggle("active");
        document.body.classList.toggle(
          "body-no-scroll",
          slideover.classList.contains("active")
        );
      }
    </script>
  </body>
</html>
